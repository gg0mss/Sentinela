<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      background-color: #e5e5e5;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 35px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333333;
      font-size: 26px;
    }

    #listaMedicacoes {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      padding: 20px;
      background-color: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-left: 5px solid #333333;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      margin-bottom: 15px;
      color: #222222;
      font-size: 20px;
    }

    .card p {
      margin-bottom: 10px;
      color: #555555;
      font-size: 15px;
      line-height: 1.5;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .card b {
      color: #333333;
    }

    #listaMedicacoes > p {
      padding: 20px;
      text-align: center;
      color: #666666;
      background-color: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>💊 Medicações Prescritas</h2>

  <div id="listaMedicacoes"></div>

</div>

<script>

function carregarMedicacoesPrescritas() {
  fetch("/medicacoes")
    .then(r => r.json())
    .then(data => {

      const div = document.getElementById("listaMedicacoes");

      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "<p>Nenhuma medicação prescrita.</p>";
        return;
      }

      data.forEach(c => {
        div.innerHTML += `
          <div class="card">
            <h3>${c.paciente}</h3>

            <p>
              <b>Medicação:</b>
              ${c.medicacao}
            </p>

            <p>
              <b>Diagnóstico:</b>
              ${c.diagnostico}
            </p>

            <p>
              <b>Observações:</b>
              ${c.obs || "Nenhuma"}
            </p>
          </div>
        `;
      });
    });
}

carregarMedicacoesPrescritas();

</script>

</body>
</html>
