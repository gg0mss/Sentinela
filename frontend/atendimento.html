<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e5e5e5;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333333;
      font-size: 28px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #bdbdbd;
      border-radius: 7px;
      background-color: #f8f8f8;
      color: #333333;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #555555;
      background-color: #ffffff;
    }

    input[type="file"] {
      cursor: pointer;
      background-color: #eeeeee;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background-color: #333333;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #555555;
    }

    button:active {
      background-color: #222222;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Atendimento</h2>

  <input id="nome" placeholder="Nome">
  <input id="cpf" placeholder="CPF">

  <select id="tipo">
    <option>Convenio</option>
    <option>Particular</option>
  </select>

  <input type="file" id="foto">

  <button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar() {
  fetch("http://localhost:3000/atendimento", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      nome: nome.value,
      cpf: cpf.value,
      tipo: tipo.value
    })
  });

  alert("Paciente enviado para triagem");
}
</script>

</body>
</html>
