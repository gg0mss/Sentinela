<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cadastro Simples</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration:none; color:cornflowerblue;
    font-size:14px; display:inline-block; margin-bottom:12px;">
        → Voltar para o login
    </a>

    <button type="button" class="btn-almoxarifado" 
    onclick="window.location.href=
    'almoxarifado.html'">Acessar Almoxarifado</button>

    <h2>Cadastrar Usuário</h2>



    <form id="formulario">
        <input type="text" id="usuario"
            placeholder="Nome do usuário (login)" required>

        <input type="password" id="senha"
            placeholder="Senha" required>

        <select id="tipo" required>
            <option value="">Selecione o setor</option>
            <option value="admin">Administrador</option>
            <option value="triagem">Triagem</option>
            <option value="medico">Médico</option>
            <option value="enfermeiro">Enfermeiro</option>
            <option value="atendimento">Atendimento</option>
        </select>

        <button type="submit">Cadastrar usuário</button>
    </form>

    <hr style="margin:25px 0; border:none; border-top:1px solid #ccc;">

    <h2>Usuários Cadastrados</h2>

    <div id="listaUsuarios"></div>
</div>

<script>
    const formulario = document.getElementById("formulario");

    // Cadastrar usuário
    formulario.addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();
        const senha = document.getElementById("senha").value;
        const tipo = document.getElementById("tipo").value;

        if (!usuario || !senha || !tipo) {
            alert("Preencha todos os campos.");
            return;
        }

        try {
            const res = await fetch("/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, senha, tipo })
            });

            const data = await res.json();

            if (!res.ok || data.erro) {
                alert("Erro: " + (data.erro || data.mensagem || "Não foi possível cadastrar."));
                return;
            }

            alert("Usuário cadastrado com sucesso!");

            formulario.reset();
            carregarUsuarios();

        } catch (erro) {
            console.error("Erro ao cadastrar:", erro);
            alert("Erro ao conectar com o servidor. Verifique se ele está funcionando.");
        }
    });

    // Carregar e listar usuários cadastrados
    async function carregarUsuarios() {
        const div = document.getElementById("listaUsuarios");

        try {
            const res = await fetch("/usuarios");

            if (!res.ok) {
                throw new Error("Erro ao buscar usuários.");
            }

            const usuarios = await res.json();

            div.innerHTML = "";

            if (!Array.isArray(usuarios) || usuarios.length === 0) {
                div.textContent = "Nenhum usuário cadastrado.";
                return;
            }

            usuarios.forEach(function(u) {
                const item = document.createElement("p");
                item.textContent = "Usuário: " + u.usuario + " | Tipo: " + u.tipo;
                div.appendChild(item);
            });

        } catch (erro) {
            console.error("Erro ao carregar usuários:", erro);
            div.textContent = "Não foi possível carregar os usuários.";
        }
    }

    // Mostrar os usuários ao abrir a página
    carregarUsuarios();
</script>







</body>
</html>
