```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <img src="./image/logo.png" alt="">
        <h2>🏥 Sistema Hospitalar</h2>

        <input id="usuario" placeholder="Usuário">
        <input id="senha" type="password" placeholder="Senha">

        <button type="button" onclick="login()">Entrar</button>
    </div>

    <script>
        async function login() {
            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;

            try {
                const resposta = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await resposta.json();

                if (!resposta.ok) {
                    alert(data.erro || "Usuário ou senha inválidos.");
                    return;
                }

                if (data.tipo === "triagem" || data.tipo === "Triagem") {
                    location.href = "triagem.html";
                } else if (data.tipo === "medico") {
                    location.href = "medico.html";
                } else if (data.tipo === "atendimento") {
                    location.href = "atendimento.html";
                } else {
                    alert("Setor de usuário não reconhecido.");
                }

            } catch (erro) {
                console.error("Erro no login:", erro);
                alert("Não foi possível conectar ao servidor.");
            }
        }

        // Atalho: Ctrl + Shift + A abre a página de administração.
        window.addEventListener("keydown", function(e) {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a") {
                e.preventDefault();
                window.location.href = "admin.html";
            }
        });
    </script>
</body>
</html>
