<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem Hospitalar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="triagem-container">

        <div class="topo">
            <h1>Triagem Hospitalar</h1>

            <button type="button" onclick="abrirTV()">
                Abrir tela da TV
            </button>
        </div>

        <section class="fila">

            <h2>Pacientes aguardando triagem</h2>

            <div id="fila-pacientes">
                Carregando pacientes...
            </div>

            <button type="button" onclick="carregarPacientes()">
                Atualizar lista
            </button>

        </section>

        <hr>

        <h2>Registrar triagem</h2>

        <form id="form-triagem">

            <label for="nome">Nome do paciente</label>

            <input
                id="nome"
                required
                placeholder="Selecione um paciente ou digite o nome"
            >

            <input id="pacienteId" type="hidden">

            <label for="sintoma">Sintoma principal</label>

            <select id="sintoma" required>
                <option value="">Selecione o sintoma</option>
                <option value="Febre">Febre</option>
                <option value="Dor">Dor</option>
                <option value="Falta de ar">Falta de ar</option>
                <option value="Tosse">Tosse</option>
                <option value="Náusea">Náusea</option>
                <option value="Vômito">Vômito</option>
                <option value="Ferimento">Ferimento</option>
                <option value="Outro">Outro</option>
            </select>

            <label for="temp">Temperatura (°C)</label>

            <input
                id="temp"
                type="number"
                step="0.1"
                placeholder="Ex.: 37.5"
            >

            <label for="alergia">Alergias</label>

            <input
                id="alergia"
                placeholder="Informe alergias conhecidas"
            >

            <label for="observacao">Observações</label>

            <textarea
                id="observacao"
                rows="3"
                placeholder="Observações adicionais"
            ></textarea>

            <button type="submit">
                Salvar triagem
            </button>

        </form>

        <div
            id="mensagem"
            class="mensagem"
            role="status"
        ></div>

    </main>

    <script>

        const fila = document.getElementById("fila-pacientes");
        const mensagem = document.getElementById("mensagem");

        // Remove as cores anteriores da mensagem
        function limparMensagem() {
            mensagem.className = "mensagem";
            mensagem.textContent = "";
        }

        // Abre a tela da TV
        function abrirTV() {
            window.open("/tv.html", "_blank");
        }

        // Carrega os pacientes aguardando triagem
        async function carregarPacientes() {

            try {

                const resposta = await fetch("/pacientes", {
                    cache: "no-store"
                });

                if (!resposta.ok) {
                    throw new Error("Erro HTTP " + resposta.status);
                }

                const pacientes = await resposta.json();

                const aguardando = pacientes.filter(
                    p => p.status === "triagem"
                );

                fila.replaceChildren();

                if (aguardando.length === 0) {

                    fila.textContent =
                        "Nenhum paciente aguardando triagem.";

                    return;
                }

                aguardando.forEach(paciente => {

                    const item = document.createElement("div");
                    item.className = "paciente-item";

                    const texto = document.createElement("span");

                    texto.textContent =
                        `${paciente.nome} — ${paciente.tipo || "Atendimento"}`;

                    // Botão selecionar
                    const selecionar = document.createElement("button");

                    selecionar.type = "button";
                    selecionar.textContent = "Selecionar";

                    selecionar.addEventListener("click", () => {

                        document.getElementById("nome").value =
                            paciente.nome;

                        document.getElementById("pacienteId").value =
                            paciente.id;

                        limparMensagem();

                        mensagem.textContent =
                            "Paciente selecionado: " + paciente.nome;

                    });

                    // Botão chamar na TV
                    const chamar = document.createElement("button");

                    chamar.type = "button";
                    chamar.textContent = "Chamar na TV";

                    chamar.addEventListener("click", () => {
                        chamarNaTV(paciente.nome);
                    });

                    item.append(texto, selecionar, chamar);

                    fila.appendChild(item);

                });

            } catch (erro) {

                console.error(erro);

                fila.textContent =
                    "Erro ao carregar pacientes. Confira se o servidor está ligado.";

            }
        }

        // Chama o paciente na TV
        async function chamarNaTV(nome) {

            limparMensagem();

            mensagem.textContent =
                "Enviando chamada para a TV...";

            try {

                const resposta = await fetch("/tv/chamar", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        localTipo: "GUICHÊ",
                        localNumero: "01",
                        paciente: nome
                    })

                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        dados.erro || "Não foi possível chamar."
                    );
                }

                mensagem.textContent =
                    `Paciente ${nome} chamado na TV!`;

            } catch (erro) {

                console.error("Erro ao chamar na TV:", erro);

                mensagem.textContent =
                    "Não foi possível chamar o paciente. Confira o servidor.";

            }
        }

        // Salvar triagem
        document.getElementById("form-triagem")
            .addEventListener("submit", async event => {

                event.preventDefault();

                limparMensagem();

                mensagem.textContent = "Salvando triagem...";

                const temperaturaTexto =
                    document.getElementById("temp").value;

                const temperatura = temperaturaTexto === ""
                    ? null
                    : Number(temperaturaTexto);

                const dados = {

                    nome: document.getElementById("nome").value.trim(),

                    pacienteId:
                        document.getElementById("pacienteId").value || null,

                    sintoma:
                        document.getElementById("sintoma").value,

                    temperatura,

                    alergia:
                        document.getElementById("alergia").value.trim(),

                    observacao:
                        document.getElementById("observacao").value.trim()

                };

                try {

                    const resposta = await fetch("/triagem", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(dados)

                    });

                    const resultado = await resposta.json();

                    if (!resposta.ok) {

                        throw new Error(
                            resultado.erro || "Erro ao salvar triagem."
                        );

                    }

                    // Identifica a classificação de risco
                    const risco = String(resultado.risco || "")
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .toLowerCase()
                        .trim();

                    // Aplica a cor correspondente
                    mensagem.className = "mensagem";

                    if (risco.includes("verde")) {

                        mensagem.classList.add("verde");

                    } else if (risco.includes("amarelo")) {

                        mensagem.classList.add("amarelo");

                    } else if (risco.includes("vermelho")) {

                        mensagem.classList.add("vermelho");

                    }

                    // Exibe o resultado
                    mensagem.textContent =
                        `Triagem salva! Classificação registrada: ${resultado.risco}.`;

                    // Limpa o formulário
                    event.target.reset();

                    document.getElementById("pacienteId").value = "";

                    // Atualiza a fila
                    carregarPacientes();

                } catch (erro) {

                    console.error(erro);

                    limparMensagem();

                    mensagem.textContent = erro.message;

                }

            });

        // Carrega os pacientes ao abrir a página
        carregarPacientes();

        // Atualiza a fila automaticamente a cada 10 segundos
        setInterval(carregarPacientes, 10000);

    </script>
<div id="menu-container"></div>




</body>
</html>
